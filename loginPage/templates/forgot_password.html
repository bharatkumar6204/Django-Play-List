<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>

<h2>Forgot Password</h2>

<form method="POST">
    {% csrf_token %}

    <input type="email" name="email" placeholder="Enter Email">

    <button type="submit">
        Submit
    </button>
</form>

{% if success %}
<p>{{ success }}</p>
{% endif %}

{% if error %}
<p>{{ error }}</p>
{% endif %}

</body>
</html>
